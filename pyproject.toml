[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keymaster-3d"
version = "0.1.0a4"
description = "Cut meshes and add mating alignment keys for 3D printing"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "trimesh>=4.8,<5",
  "manifold3d>=3,<4",
  "PySide6_Essentials>=6.8,<7",
  "PySide6_Addons>=6.8,<7",
  "pyvista>=0.45,<0.49",
  "pyvistaqt>=0.11,<1",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.15,<7"]

[project.scripts]
keymaster = "keymaster.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
